<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#3f3f46" stroke-width="6" opacity="0.4"/>

  <!-- Glowing outer halo ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#f59e0b" stroke-width="8" opacity="0.25" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#f59e0b" stroke-width="12" opacity="0.5"/>

  <!-- Walkie Antenna -->
  <rect x="238" y="55" width="36" height="80" rx="18" fill="#3f3f46" />
  <rect x="246" y="35" width="20" height="30" rx="10" fill="#52525b" />

  <!-- Center Walkie Body -->
  <rect x="156" y="130" width="200" height="280" rx="48" fill="#18181b" stroke="url(#amberGrad)" stroke-width="10" filter="url(#glow)"/>

  <!-- Screen / Speaker Grill -->
  <rect x="180" y="160" width="152" height="90" rx="20" fill="#09090b" stroke="#3f3f46" stroke-width="4"/>
  
  <!-- 11:11 Glowing Text -->
  <text x="256" y="218" font-family="'JetBrains Mono', system-ui, monospace" font-size="38" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="2">11:11</text>

  <!-- Giant PTT Talk Button -->
  <circle cx="256" cy="320" r="45" fill="url(#amberGrad)" filter="url(#glow)"/>
  <path d="M256 298v44M234 320h44" stroke="#09090b" stroke-width="10" stroke-linecap="round"/>
</svg>
